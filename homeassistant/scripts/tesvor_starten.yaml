# Skript für Home Assistant (scripts.yaml): Reinigung starten.\n# Auf der Ladestation (charging/docked/hibernated) ignoriert der Roboter Startbefehle ohne Quittung;\n# ein Stopp vorab weckt ihn. Deshalb: Stopp, 3 s warten, dann die gewünschte Starttaste. Das Gerät\n# wird aus der Taste abgeleitet, das Skript gilt damit für alle Roboter (Präfix vor _smart_cleaning usw.).\ntesvor_starten:
  alias: Tesvor – Reinigung starten
  description: Weckt den Saugroboter bei Bedarf mit Stopp und drückt dann die gewünschte Starttaste.
    Funktioniert für jeden Tesvor, das Gerät wird aus der übergebenen Taste abgeleitet (Präfix vor
    _smart_cleaning, _edge_cleaning usw.).
  icon: mdi:robot-vacuum
  mode: parallel
  fields:
    taste:
      name: Starttaste
      description: ESPHome-Taste des Reinigungsmodus (z. B. button.tesvor_x500_pro_smart_cleaning)
      required: true
      default: button.tesvor_x500_pro_smart_cleaning
      selector:
        entity:
          domain: button
          integration: esphome
  variables:
    geraet: "{{ taste.split('.')[1].rsplit('_', 2)[0] }}"
  sequence:
  - if:
    - condition: template
      value_template: "{{ states('sensor.' ~ geraet ~ '_state') in ['charging', 'docked', 'hibernated'] }}"
    then:
    - action: button.press
      target:
        entity_id: "button.{{ geraet }}_stop"
    - delay:
        seconds: 3
  - action: button.press
    target:
      entity_id: '{{ taste }}'

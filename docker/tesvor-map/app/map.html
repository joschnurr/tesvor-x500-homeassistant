<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tesvor Route</title>
  <style>
    :root {
      --bg: #12161d;
      --panel: #1d2430;
      --text: #f4f6f8;
      --muted: #aab4c2;
      --accent: #2ead6b;
      --grid: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    h1 {
      font-size: 17px;
      margin: 0;
      white-space: nowrap;
    }

    select, button {
      background: #2a3341;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      min-width: 0;
    }

    #archiveSelect {
      flex: 1;
      max-width: 520px;
    }

    /* Geräteauswahl erscheint nur, wenn der Writer mehr als ein Gerät kennt */
    #deviceSelect { display: none; max-width: 240px; }
    body.multi #deviceSelect { display: inline-block; }

    /* Karte füllt den Platz zwischen Kopf- und Statuszeile; die Canvas-Höhe folgt dem Container
       (ResizeObserver), nicht einer festen Pixelzahl. */
    main {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at center, #1a2029 0%, #11151b 100%);
    }

    /* Statuszeile als normales Element unter der Karte, nicht mehr über dem Canvas */
    #info {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 6px 12px;
      background: var(--panel);
      border-top: 1px solid rgba(255,255,255,.08);
      color: var(--muted);
      font-size: 13px;
    }

    #lastPoint {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #badge {
      color: #fff;
      background: rgba(46,173,107,.22);
      border: 1px solid rgba(46,173,107,.5);
      border-radius: 999px;
      padding: 4px 10px;
    }

    @media (max-width: 620px) {
      header {
        flex-wrap: wrap;
      }

      h1 {
        width: 100%;
      }

      #archiveSelect {
        flex: 1 1 calc(100% - 90px);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tesvor Route</h1>
    <select id="deviceSelect" title="Gerät auswählen"></select>
    <select id="archiveSelect" title="Route auswählen">
      <option value="current.json">Aktuelle Route</option>
    </select>
    <button id="reloadBtn" type="button">Neu laden</button>
  </header>

  <main>
    <canvas id="map"></canvas>
  </main>
  <div id="info">
    <span id="badge">warte auf Daten…</span>
    <span id="lastPoint"></span>
  </div>

  <script>
    const canvas = document.getElementById("map");
    const ctx = canvas.getContext("2d");
    const archiveSelect = document.getElementById("archiveSelect");
    const deviceSelect = document.getElementById("deviceSelect");
    const reloadBtn = document.getElementById("reloadBtn");
    const badge = document.getElementById("badge");
    const lastPoint = document.getElementById("lastPoint");

    let currentUrl = "current.json";   // relativ zum Geräteordner
    let device = new URLSearchParams(location.search).get("device") || "";
    let timer = null;
    let lastData = null;

    // Daten liegen je Gerät in <gerät>/… (devices.json des Writers). Ohne Geräteliste (alte
    // Writer-Fassung) werden die Dateien direkt neben map.html erwartet.
    const devPath = rel => (device ? `${device}/${rel}` : rel);

    async function loadDevices() {
      try {
        const res = await fetch("devices.json?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const list = (await res.json()).devices || [];
        if (!list.length) return;
        if (!list.some(d => d.id === device)) device = list[0].id;
        deviceSelect.innerHTML = "";
        for (const d of list) {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = d.name && d.name !== d.id ? `${d.name} (${d.id})` : d.id;
          deviceSelect.appendChild(opt);
        }
        deviceSelect.value = device;
        document.body.classList.toggle("multi", list.length > 1);
      } catch (e) {
        console.warn("devices.json nicht lesbar", e);
      }
    }

    // Lesbare Beschriftung für Archivrouten: "Route Montag 22.10. 15:00 (748 Punkte)".
    // Zeitpunkt = Start der Fahrt (Feld "started" im Index), sonst der Zeitstempel aus dem
    // Dateinamen tesvor_map_JJJJ-MM-TT_HH-MM-SS_*.json (= Ende der Fahrt).
    function archivLabel(f) {
      let d = f.started ? new Date(f.started) : null;
      if (!d || isNaN(d)) {
        const m = /(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})/.exec(f.name || "");
        if (m) d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
      }
      if (!d || isNaN(d)) return f.name;
      const tag = d.toLocaleDateString("de-DE", { weekday: "long" });
      const datum = `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`;
      const zeit = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      const punkte = Number.isFinite(f.point_count) ? ` (${f.point_count} Punkte)` : "";
      return `Route ${tag} ${datum} ${zeit}${punkte}`;
    }

    function normalizePoint(p) {
      if (Array.isArray(p)) {
        return {
          seq: Number(p[0]),
          x: Number(p[1]),
          y: Number(p[2]),
          type: Number(p[3])
        };
      }

      return {
        seq: Number(p.seq),
        x: Number(p.x),
        y: Number(p.y),
        type: Number(p.type)
      };
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawGrid(w, h) {
      ctx.strokeStyle = "rgba(255,255,255,.07)";
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y < h; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
    }

    function drawMap(data) {
      lastData = data;
      resizeCanvas();

      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);
      drawGrid(w, h);

      const points = (data.points || [])
        .map(normalizePoint)
        .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));

      badge.textContent = `${points.length} Punkte`;
      if (!points.length) {
        lastPoint.textContent = "keine Punkte";
        return;
      }

      const xs = points.map(p => p.x);
      const ys = points.map(p => p.y);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);

      // Bounding Box aller Punkte -> ein gemeinsamer Maßstab für x und y (keine Verzerrung),
      // ~5 % Rand (bezogen auf die kleinere Canvas-Seite) und mittig im Canvas.
      const pad = Math.max(8, Math.min(w, h) * 0.05);
      const spanX = Math.max(1, maxX - minX);
      const spanY = Math.max(1, maxY - minY);
      const scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanY);
      const offX = (w - spanX * scale) / 2;
      const offY = (h - spanY * scale) / 2;

      const mapX = x => offX + (x - minX) * scale;
      const mapY = y => h - offY - (y - minY) * scale;

      // Linien nur zwischen aufeinanderfolgenden Punkten gleichen Typs; bei einem Typwechsel
      // beginnt ein neues Segment, es gibt keine Verbindung über die Segmentgrenze.
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(46,173,107,.75)";
      ctx.beginPath();
      points.forEach((p, idx) => {
        const x = mapX(p.x);
        const y = mapY(p.y);
        if (idx === 0 || p.type !== points[idx - 1].type) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      for (const p of points) {
        const x = mapX(p.x);
        const y = mapY(p.y);
        ctx.beginPath();
        ctx.fillStyle = p.type === 3 ? "#ffb74d" : (p.type === 2 ? "#4aabdb" : "#2ead6b");
        ctx.arc(x, y, p.type === 3 ? 4 : 3, 0, Math.PI * 2);
        ctx.fill();
      }

      const last = points[points.length - 1];
      const lx = mapX(last.x);
      const ly = mapY(last.y);

      ctx.beginPath();
      ctx.fillStyle = "#ff2d8d";
      ctx.arc(lx, ly, 7, 0, Math.PI * 2);
      ctx.fill();

      lastPoint.textContent = `Letzter Punkt: x=${last.x}, y=${last.y}, Typ ${last.type}`;
    }

    async function loadArchiveIndex() {
      try {
        const res = await fetch(devPath("archive_index.json") + "?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const index = await res.json();

        const currentValue = archiveSelect.value || "current.json";
        archiveSelect.innerHTML = '<option value="current.json">Aktuelle Route</option>';

        for (const f of index.files || []) {
          const opt = document.createElement("option");
          opt.value = f.path;
          opt.textContent = archivLabel(f);
          archiveSelect.appendChild(opt);
        }

        archiveSelect.value = [...archiveSelect.options].some(o => o.value === currentValue)
          ? currentValue
          : "current.json";
      } catch (e) {
        console.warn("archive_index.json nicht lesbar", e);
      }
    }

    async function loadMap() {
      try {
        const url = devPath(currentUrl) + "?ts=" + Date.now();
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const data = await res.json();
        drawMap(data);
      } catch (e) {
        badge.textContent = "Fehler beim Laden";
        lastPoint.textContent = String(e.message || e);
      }
    }

    async function reloadAll() {
      await loadDevices();
      await loadArchiveIndex();
      await loadMap();
    }

    deviceSelect.addEventListener("change", async () => {
      device = deviceSelect.value;
      currentUrl = "current.json";
      clearInterval(timer);
      timer = setInterval(loadMap, 3000);
      await loadArchiveIndex();
      await loadMap();
    });

    archiveSelect.addEventListener("change", () => {
      currentUrl = archiveSelect.value;
      clearInterval(timer);
      timer = null;

      if (currentUrl === "current.json") {
        timer = setInterval(loadMap, 3000);
      }

      loadMap();
    });

    reloadBtn.addEventListener("click", reloadAll);

    // Canvas-Größe folgt dem Container (auch im iframe von Home Assistant): bei jeder
    // Größenänderung aus den zuletzt geladenen Daten neu zeichnen, ohne neu zu laden.
    const redraw = () => { if (lastData) drawMap(lastData); };
    if (window.ResizeObserver) {
      new ResizeObserver(redraw).observe(document.querySelector("main"));
    } else {
      window.addEventListener("resize", redraw);
    }

    reloadAll();
    timer = setInterval(loadMap, 3000);
  </script>
</body>
</html>

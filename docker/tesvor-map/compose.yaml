# Karten-Writer für den Tesvor X500 (ESPHome-Firmware aus diesem Repository / hannes813).
# Jeder Roboter schickt Pfadpunkte per MQTT (<präfix>/map/points) und den Status (<präfix>/state).
# Dieser eine Container bedient beliebig viele Roboter und legt je Gerät einen Ordner mit
# current.json + archive/ im www-Ordner von Home Assistant an; die Kartenseite bietet dann eine
# Geräteauswahl (/local/tesvor-map/map.html, iframe-Karte).
# Konfiguration über .env (Vorlage .env.example): Broker-Adresse und Pfad zum www-Ordner.
services:
  tesvor-map:
    image: python:3.12-alpine
    container_name: tesvor-map
    restart: unless-stopped
    command: >
      sh -c "pip install --quiet --no-cache-dir 'paho-mqtt<2' && exec python /app/tesvor_map_writer.py"
    environment:
      TESVOR_MQTT_HOST: ${MQTT_HOST}
      TESVOR_MQTT_PORT: ${MQTT_PORT:-1883}
      TESVOR_MQTT_USER: ${MQTT_USER:-}
      TESVOR_MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      TESVOR_MAP_DIR: /data
      TESVOR_TOPIC_ROOT: ${TOPIC_ROOT:-tesvor}        # Firmware-Präfix ist <root>/<gerät>, z. B. tesvor/x500
      TESVOR_DEFAULT_DEVICE: ${DEFAULT_DEVICE:-x500}  # Zielordner für Daten aus der Einzelgerät-Zeit (v1.0.x)
      TESVOR_DEVICE_NAMES: ${DEVICE_NAMES:-}          # Anzeigenamen, z. B. x500=Erdgeschoss,x500-2=Keller
      TESVOR_ARCHIVE_KEEP: ${ARCHIVE_KEEP:-30}   # max. Archivkarten, ältere werden gelöscht (0 = unbegrenzt)
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./app:/app:ro
      - ${HA_WWW_TESVOR}:/data
